services:
  client:
    build:
      context: .
      dockerfile: ./client/Dockerfile
    ports:
      - "3030:3000"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - blurtz-network
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    # Every mount is now under the workspace root: the image's WORKDIR is /app
    # (the repo root), so /app/client is the client package and /app/shared is
    # the shared one. Nothing is mounted at /app/node_modules - the hoisted
    # tree the image installed has to survive.
    volumes:
      - ./client/src:/app/client/src
      - ./client/package.json:/app/client/package.json
      - ./client/tsconfig.json:/app/client/tsconfig.json
      - ./client/vite.config.ts:/app/client/vite.config.ts
      - ./client/index.html:/app/client/index.html
      # The container rebuilds shared from this on start (see the Dockerfile's
      # CMD); Vite reads the built dist/, never these sources.
      - ./shared/src:/app/shared/src

  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    ports:
      - "3031:3001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    networks:
      - blurtz-network
    # Every mount is now under the workspace root - see the client's note.
    volumes:
      - ./server/src:/app/server/src
      - ./server/prisma:/app/server/prisma
      - ./server/package.json:/app/server/package.json
      - ./server/tsconfig.json:/app/server/tsconfig.json
      - ./server/nest-cli.json:/app/server/nest-cli.json
      - ./server/prisma.config.ts:/app/server/prisma.config.ts
      # The container rebuilds shared from this on start (see the Dockerfile's
      # CMD); the server imports the built dist/, never these sources.
      - ./shared/src:/app/shared/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:16-alpine
    ports:
      - "5442:5432"
    volumes:
      - blurtz_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=blurtz
      - POSTGRES_USER=blurtz
      - POSTGRES_PASSWORD=blurtz
    networks:
      - blurtz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blurtz -d blurtz"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - blurtz-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

networks:
  blurtz-network:
    driver: bridge

volumes:
  blurtz_data:
  redis_data:
